<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4撿骨182｜管理後台</title>
<script src="../firebase-config.js"></script>
<style>
:root{--bg:#030201;--panel:#0a0705;--line:#5e411f;--gold:#dfb158;--gold2:#f0c86f;--text:#dfcfaa;--muted:#958262}
*{box-sizing:border-box}body{margin:0;background:#020201;color:var(--text);font-family:"Microsoft JhengHei",sans-serif}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}
.login{width:min(430px,92vw);margin:9vh auto;border:1px solid var(--line);background:#090604;padding:28px}.login h1{text-align:center;color:var(--gold);margin:0 0 5px}.login p{text-align:center;color:var(--muted)}
.field{display:grid;gap:5px;margin:9px 0}.field span{font-size:12px;color:#aa946e}.input,.textarea,.select{width:100%;border:1px solid #4d371d;background:#050403;color:#ead8b5;padding:9px}.textarea{min-height:120px;resize:vertical}
.btn{border:1px solid #946326;background:#573813;color:#f4ddaa;padding:9px 14px;cursor:pointer}.btn.danger{background:#501715;border-color:#823028}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.side{background:#080604;border-right:1px solid #4b351a;padding:15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{color:var(--gold);font-weight:900;font-size:23px;margin:4px 0 4px}.lock{font-size:11px;color:#9e8a67;line-height:1.6;margin:0 0 15px}
.side button,.side a{display:block;width:100%;text-align:left;border:1px solid #3e2c18;background:#0b0806;color:#cbb487;padding:10px;margin:6px 0;cursor:pointer}.side button.active{border-color:#a9722c;color:var(--gold2);background:#171006}
.main{padding:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.head h1{margin:0;color:var(--gold);font-size:25px}.status{font-size:12px;color:#8fb678}
.card{border:1px solid #4b351b;background:#090705;padding:16px;margin-bottom:13px}.card h2{margin:0 0 13px;color:#d8aa54;font-size:18px}.row{border:1px solid #342617;background:#060504;padding:11px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wide{grid-column:1/-1}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid #49351d;background:#090705;color:#c4ad83;padding:7px 10px;cursor:pointer}.tabs button.active{border-color:#a66f29;color:#f0c56b}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hint{font-size:11px;color:#8f7c5d;margin-top:4px}.list{display:grid;gap:8px}.item{border:1px solid #342617;background:#060504;padding:11px}
.item summary{cursor:pointer;color:#e0b159;font-weight:700}.item summary small{float:right;color:#8f7c5d;font-weight:400}.advanced{margin-top:10px;border-top:1px dashed #3d2b18;padding-top:9px}.advanced summary{color:#a99470;font-size:12px}
.entry-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;margin-top:14px}.entry-list{border:1px solid #3d2b17;background:#050403;padding:8px;max-height:620px;overflow:auto}.entry-list button{display:block;width:100%;text-align:left;border:1px solid #342617;background:#090705;color:#d8c49d;padding:10px;margin:0 0 7px;cursor:pointer}.entry-list button.active{border-color:#b0792f;background:#171006;color:#f0c66a}.entry-list b,.entry-list small{display:block}.entry-list small{margin-top:4px;color:#8f7c5d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-editor{border:1px solid #3d2b17;background:#060504;padding:12px}
@media(max-width:1000px){.entry-layout{grid-template-columns:1fr}.entry-list{max-height:260px}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section id="login" class="login">
  <h1>F4撿骨182</h1><p>網站內容管理後台</p>
  <label class="field"><span>電子郵件</span><input id="email" class="input" type="email"></label>
  <label class="field"><span>密碼</span><input id="pass" class="input" type="password"></label>
  <button id="loginBtn" class="btn" style="width:100%">登入後台</button><p id="loginMsg"></p><p><a href="../" target="_blank">← 回官方網站</a></p>
</section>

<div id="shell" class="shell" hidden>
<aside class="side">
  <div class="brand">F4撿骨182 CMS</div>
  <p class="lock">操作方式照死亡騎士182。前台版型固定，後台只改內容，不重新設計。</p>
  <button data-tab="buttons" class="active">網站按鈕設定</button>
  <button data-tab="guides">遊戲介紹內容管理</button>
  <button data-tab="rates">遊戲資訊設定</button>
  <button data-tab="features">遊戲特色管理</button>
  <button data-tab="news">公告管理</button>
  <button data-tab="site">首頁文字與樣式</button>
  <a href="../" target="_blank">開啟前台網站</a>
  <button id="logout">登出</button>
</aside>
<main class="main">
  <div class="head"><h1 id="title">網站按鈕設定</h1><span id="status" class="status">已連接 Firebase</span></div>
  <div id="content"></div>
</main>
</div>

<script type="module">
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js');
const {getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');
const app=initializeApp(window.F4_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let S={},tab='buttons',guideId='server',guideEntryId=null;
const todayTW=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

async function rc(n){const s=await getDocs(collection(db,n));return s.docs.map(d=>({__docId:d.id,...d.data()}))}
async function load(){
 const [buttons,sections,entries,rates,support,downloads,features,news]=await Promise.all([rc('hero_buttons'),rc('content_sections'),rc('guide_entries'),rc('game_rates'),rc('support_links'),rc('download_links'),rc('game_features'),rc('announcements')]);
 const ss=await getDoc(doc(db,'site_settings','main'));
 const sort=a=>a.sort((x,y)=>(Number(x.sort_order||0)-Number(y.sort_order||0))||String(x.id||'').localeCompare(String(y.id||'')));
 S={buttons:sort(buttons),sections:sort(sections),entries:sort(entries),rates:sort(rates),support:sort(support),downloads:sort(downloads),features:sort(features),news:news.sort((a,b)=>(+!!b.pinned)-(+!!a.pinned)||String(b.published_on||'').localeCompare(String(a.published_on||''))),site:ss.exists()?ss.data():{}}
}
async function saveDoc(col,x,id){const data={...x};delete data.__docId;data.updated_at=new Date().toISOString();await setDoc(doc(db,col,String(id??x.__docId??x.id)),data,{merge:true})}
function fld(label,val,key,type='text',wide=false){
 let h;if(type==='textarea')h=`<textarea class="textarea e" data-key="${key}">${esc(val)}</textarea>`;
 else if(type==='bool')h=`<select class="select e" data-key="${key}" data-type="bool"><option value="true"${val!==false?' selected':''}>顯示</option><option value="false"${val===false?' selected':''}>隱藏</option></select>`;
 else if(type==='number')h=`<input class="input e" data-key="${key}" data-type="number" type="number" value="${esc(val??0)}">`;
 else if(type==='color')h=`<input class="input e" data-key="${key}" type="color" value="${esc(val||'#ffffff')}">`;
 else h=`<input class="input e" data-key="${key}" value="${esc(val??'')}">`;
 return `<label class="field ${wide?'wide':''}"><span>${label}</span>${h}</label>`
}
function readBox(box,obj){box.querySelectorAll('.e').forEach(el=>{let v=el.value;if(el.dataset.type==='bool')v=v==='true';if(el.dataset.type==='number')v=Number(v);obj[el.dataset.key]=v})}
const saveState=m=>$('#status').textContent=m;

function render(){
 const C=$('#content'),titles={buttons:'網站按鈕設定',guides:'遊戲介紹內容管理',rates:'遊戲資訊設定',features:'遊戲特色管理',news:'公告管理',site:'首頁文字與樣式'};
 $('#title').textContent=titles[tab];$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='buttons')renderButtons(C); if(tab==='guides')renderGuides(C); if(tab==='rates')renderRates(C); if(tab==='features')renderFeatures(C); if(tab==='news')renderNews(C); if(tab==='site')renderSite(C)
}
function renderButtons(C){
 C.innerHTML=`<section class="card"><h2>網站按鈕設定</h2><p class="hint">死亡騎士182一樣：上方主按鈕、客服按鈕、下載按鈕都在這一頁設定。</p>
 <h3>上方主按鈕</h3>${S.buttons.map((x,i)=>`<div class="row box" data-type="button" data-i="${i}"><div class="grid">${fld('名稱',x.title,'title')}${fld('連結網址',x.url,'url','text',true)}${fld('顯示',x.visible,'visible','bool')}</div></div>`).join('')}
 <h3>客服與支持</h3>${S.support.map((x,i)=>`<div class="row box" data-type="support" data-i="${i}"><div class="grid">${fld('名稱',x.title,'title')}${fld('連結網址',x.url,'url','text',true)}${fld('顯示',x.visible,'visible','bool')}</div></div>`).join('')}
 <h3>下載專區</h3>${S.downloads.map((x,i)=>`<div class="row box" data-type="download" data-i="${i}"><div class="grid">${fld('名稱',x.title,'title')}${fld('下載網址',x.url,'url','text',true)}${fld('顯示',x.visible,'visible','bool')}</div></div>`).join('')}
 <div class="actions"><button id="saveButtons" class="btn">儲存設定</button></div></section>`;
 $('#saveButtons').onclick=async()=>{saveState('儲存中…');for(const b of $$('.box')){const t=b.dataset.type,i=Number(b.dataset.i),arr=t==='button'?S.buttons:t==='support'?S.support:S.downloads,col=t==='button'?'hero_buttons':t==='support'?'support_links':'download_links';readBox(b,arr[i]);await saveDoc(col,arr[i])}saveState('已儲存')}
}
function renderRates(C){
 C.innerHTML=`<section class="card"><h2>遊戲資訊設定</h2>${S.rates.map((x,i)=>`<div class="row rateBox" data-i="${i}"><div class="grid">${fld('名稱',x.label,'label')}${fld('倍率',x.value,'value','number')}</div></div>`).join('')}<div class="actions"><button id="saveRates" class="btn">儲存設定</button></div></section>`;
 $('#saveRates').onclick=async()=>{saveState('儲存中…');for(const b of $$('.rateBox')){const i=Number(b.dataset.i);readBox(b,S.rates[i]);await saveDoc('game_rates',S.rates[i])}saveState('已儲存')}
}
function renderFeatures(C){
 C.innerHTML=`<section class="card"><h2>遊戲特色管理</h2>${S.features.map((x,i)=>`<div class="row featBox" data-i="${i}"><div class="grid">${fld('標題',x.title,'title')}${fld('副標',x.subtitle,'subtitle')}${fld('圖片網址',x.image_url,'image_url','text',true)}${fld('顯示',x.visible,'visible','bool')}</div></div>`).join('')}<div class="actions"><button id="saveFeatures" class="btn">儲存設定</button></div></section>`;
 $('#saveFeatures').onclick=async()=>{saveState('儲存中…');for(const b of $$('.featBox')){const i=Number(b.dataset.i);readBox(b,S.features[i]);await saveDoc('game_features',S.features[i])}saveState('已儲存')}
}
function renderSite(C){
 const x=S.site||{};
 C.innerHTML=`<section class="card"><h2>首頁文字與樣式</h2><div id="siteBox" class="grid">${fld('網站名稱',x.brand,'brand')}${fld('首頁主標題',x.hero_title,'hero_title')}${fld('上方小標',x.hero_kicker,'hero_kicker')}${fld('主標語',x.hero_slogan,'hero_slogan','text',true)}${fld('頁尾文字',x.footer_text,'footer_text','text',true)}
 <details class="advanced wide"><summary>進階：字體大小／顏色</summary><div class="grid">${fld('主標題大小',x.hero_title_size,'hero_title_size','number')}${fld('主標題顏色',x.hero_title_color,'hero_title_color','color')}${fld('小標大小',x.hero_kicker_size,'hero_kicker_size','number')}${fld('小標顏色',x.hero_kicker_color,'hero_kicker_color','color')}${fld('標語大小',x.hero_slogan_size,'hero_slogan_size','number')}${fld('標語顏色',x.hero_slogan_color,'hero_slogan_color','color')}</div></details></div><div class="actions"><button id="saveSite" class="btn">儲存設定</button></div></section>`;
 $('#saveSite').onclick=async()=>{readBox($('#siteBox'),x);S.site=x;await saveDoc('site_settings',x,'main');saveState('已儲存')}
}
function renderNews(C){
 C.innerHTML=`<section class="card"><h2>公告管理</h2><div class="actions"><button id="addNews" class="btn">＋ 新增公告</button></div><div class="list">
 ${S.news.map((n,i)=>`<details class="item newsBox" data-i="${i}"><summary>${esc(n.title||'未命名公告')} <small>${esc(n.published_on||'')}</small></summary><div class="grid" style="margin-top:10px">
 ${fld('分類',n.category,'category')}${fld('標題',n.title,'title','text',true)}${fld('摘要',n.summary,'summary','textarea',true)}${fld('完整內容',n.body,'body','textarea',true)}${fld('圖片網址',n.image_url,'image_url','text',true)}${fld('顯示',n.visible,'visible','bool')}${fld('置頂',n.pinned,'pinned','bool')}
 <details class="advanced wide"><summary>進階：字體大小／顏色</summary><div class="grid">${fld('標題大小',n.title_size,'title_size','number')}${fld('標題顏色',n.title_color,'title_color','color')}${fld('摘要大小',n.summary_size,'summary_size','number')}${fld('摘要顏色',n.summary_color,'summary_color','color')}${fld('內文大小',n.body_size,'body_size','number')}${fld('內文顏色',n.body_color,'body_color','color')}</div></details></div>
 <div class="actions"><button class="btn saveNews">儲存公告</button><button class="btn danger delNews">刪除此公告</button></div></details>`).join('')}</div></section>`;
 $('#addNews').onclick=async()=>{const id=Date.now(),n={id,category:'公告',title:'新公告',summary:'',body:'',image_url:'',images:[],published_on:todayTW(),pinned:false,visible:true,title_size:22,title_color:'#e7bd66',summary_size:14,summary_color:'#a8926a',body_size:16,body_color:'#ddc89e'};await saveDoc('announcements',n,id);S.news.unshift({...n,__docId:String(id)});render()};
 $$('.saveNews').forEach((b,k)=>b.onclick=async()=>{const box=b.closest('.newsBox'),i=Number(box.dataset.i),n=S.news[i];readBox(box,n);if(!n.published_on)n.published_on=todayTW();await saveDoc('announcements',n);saveState('已儲存')});
 $$('.delNews').forEach(b=>b.onclick=async()=>{const box=b.closest('.newsBox'),i=Number(box.dataset.i),n=S.news[i];if(!confirm('確定刪除此公告？'))return;await deleteDoc(doc(db,'announcements',String(n.__docId??n.id)));S.news.splice(i,1);render()})
}
function renderGuides(C){
 const ci=Math.max(0,S.sections.findIndex(x=>x.id===guideId)),cat=S.sections[ci]||S.sections[0],entries=S.entries.filter(x=>x.category_id===guideId).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||(a.id||0)-(b.id||0));
 if(!entries.some(x=>String(x.id)===String(guideEntryId)))guideEntryId=entries[0]?.id??null;const e=entries.find(x=>String(x.id)===String(guideEntryId));
 C.innerHTML=`<section class="card"><h2>遊戲介紹內容管理</h2><div class="tabs">${S.sections.map(x=>`<button data-g="${x.id}" class="${x.id===guideId?'active':''}">${esc(x.title)}</button>`).join('')}</div>
 <div class="entry-layout"><div class="entry-list"><button id="addEntry" class="btn" style="text-align:center">＋ 新增文章</button>${entries.map(x=>`<button data-e="${x.id}" class="${String(x.id)===String(guideEntryId)?'active':''}"><b>${esc(x.title||'未命名')}</b><small>${esc(x.intro||'')}</small></button>`).join('')}</div>
 <div class="entry-editor">${e?`<div id="guideBox" class="grid">${fld('文章標題',e.title,'title')}${fld('排序',e.sort_order,'sort_order','number')}${fld('文章簡介',e.intro,'intro','textarea',true)}${fld('完整內容',e.content,'content','textarea',true)}<label class="field wide"><span>圖片網址（每行一張）</span><textarea id="imgLines" class="textarea">${esc((Array.isArray(e.images)?e.images:[]).join('\n'))}</textarea></label>${fld('顯示',e.visible,'visible','bool')}<details class="advanced wide"><summary>進階：字體大小／顏色</summary><div class="grid">${fld('標題大小',e.title_size,'title_size','number')}${fld('標題顏色',e.title_color,'title_color','color')}${fld('簡介大小',e.intro_size,'intro_size','number')}${fld('簡介顏色',e.intro_color,'intro_color','color')}${fld('內文大小',e.content_size,'content_size','number')}${fld('內文顏色',e.content_color,'content_color','color')}</div></details></div><div class="actions"><button id="saveEntry" class="btn">儲存文章</button><button id="delEntry" class="btn danger">刪除此文章</button></div>`:'請新增或選擇文章'}</div></div></section>`;
 $$('[data-g]').forEach(b=>b.onclick=()=>{guideId=b.dataset.g;guideEntryId=null;render()});$$('[data-e]').forEach(b=>b.onclick=()=>{guideEntryId=b.dataset.e;render()});
 $('#addEntry').onclick=async()=>{const id=Date.now(),x={id,category_id:guideId,title:'新文章',intro:'',content:'',images:[],sort_order:0,visible:true,title_size:22,title_color:'#ffd987',intro_size:14,intro_color:'#b8ad9e',content_size:16,content_color:'#e8dcc9'};await saveDoc('guide_entries',x,id);S.entries.push({...x,__docId:String(id)});guideEntryId=id;render()};
 if(e){$('#saveEntry').onclick=async()=>{readBox($('#guideBox'),e);e.images=$('#imgLines').value.split('\n').map(s=>s.trim()).filter(Boolean);await saveDoc('guide_entries',e);saveState('已儲存')};$('#delEntry').onclick=async()=>{if(!confirm('確定刪除此文章？'))return;await deleteDoc(doc(db,'guide_entries',String(e.__docId??e.id)));S.entries=S.entries.filter(x=>String(x.id)!==String(e.id));guideEntryId=null;render()}}
}

$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='登入中…';await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#pass').value)}catch(e){$('#loginMsg').textContent='登入失敗，請檢查信箱與密碼'}};
$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(u){$('#login').hidden=true;$('#shell').hidden=false;saveState('載入中…');await load();saveState('已連接 Firebase');render()}else{$('#login').hidden=false;$('#shell').hidden=true}})
</script>
</body></html>
