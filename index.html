<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4撿骨182｜網站內容管理後台</title>
<script src="../firebase-config.js"></script>
<style>
:root{--bg:#050507;--panel:#090a0f;--gold:#d19a3a;--light:#ffd98b;--line:#765127;--text:#f8edda;--muted:#b9ad9b}
*{box-sizing:border-box}html{background:#050507}body{margin:0;background:#050507;color:var(--text);font-family:"Microsoft JhengHei",sans-serif}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}button{color:inherit}

/* 1:1 沿用死亡騎士182後台視覺 */
#adminApp{min-height:100vh;background:#070604;color:#ead9b7;font-family:"Microsoft JhengHei",sans-serif}
.cms-login{width:min(430px,92vw);margin:8vh auto;border:1px solid #6f4b21;background:#0b0906;padding:26px;box-shadow:0 16px 60px #000}
.cms-login h1{text-align:center;color:#e4b65c;margin:0 0 8px}.cms-login p{text-align:center;color:#9c8968}
.cms-login input{display:block;width:100%;padding:11px;margin:8px 0;border:1px solid #4b351c;background:#050403;color:#f0dfbd}
.cms-login button{width:100%;padding:11px;border:1px solid #996727;background:#573813;color:#f6dfb0;cursor:pointer}
.cms-login a{display:block;text-align:center;margin-top:14px;color:#b69a67}

.cms-shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.cms-side{position:sticky;top:0;height:100vh;overflow:auto;padding:15px;background:#080604;border-right:1px solid #4a341b}
.cms-side h2{margin:4px 0 16px;color:#e0b25a}
.cms-side button,.cms-side a{display:block;width:100%;padding:11px;margin:6px 0;border:1px solid #3f2d18;background:#0b0907;color:#cdb68a;text-align:left;cursor:pointer}
.cms-side button.active{border-color:#ad742e;background:#171007;color:#ffd172}
.cms-main{padding:22px;min-width:0}
.cms-main-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px}
.cms-main-head h1{margin:0;color:#e2b75e}.cms-status{color:#9d8a68;font-size:13px}
.cms-card{border:1px solid #4a341b;background:#0b0907;padding:18px;margin-bottom:15px}
.cms-card h2{margin:0 0 14px;color:#dfb45c}
.cms-card-head{display:flex;justify-content:space-between;align-items:center}
.cms-card-head button,.cms-save,.cms-delete{padding:9px 14px;border:1px solid #996727;background:#5d3b14;color:#f2d69f;cursor:pointer}
.cms-delete{margin-top:10px;background:#5a1714;border-color:#8f322b}
.cms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.cms-field{display:grid;gap:6px}.cms-field.wide{grid-column:1/-1}.cms-field span{font-size:12px;color:#b99f72}
.cms-field input,.cms-field textarea,.cms-field select{width:100%;padding:9px;border:1px solid #4b351c;background:#050403;color:#f0dfbd}
.cms-field textarea{min-height:125px;resize:vertical}
.cms-subcard{padding:12px;margin:9px 0;border:1px solid #382918;background:#080604}
.cms-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.cms-tabs button{padding:7px 10px;border:1px solid #49351d;background:#090705;color:#c3ab81;cursor:pointer}
.cms-tabs button.active{color:#f0c56b;border-color:#a66f29}
.cms-ann{margin:9px 0;border:1px solid #3b2b18;background:#080604}
.cms-ann summary{padding:11px;cursor:pointer}.cms-ann summary small{float:right;color:#8a795f}.cms-ann .cms-grid{padding:12px}
.cms-save{margin-top:12px}.cms-back{color:#b69865}
.tag{display:inline-block;padding:3px 6px;border-radius:2px;color:#fff;text-align:center;font-size:10px}
.tag-pinned{background:#8d3428}.tag-activity{background:#386e14}.tag-announcement{background:#a13b29}.tag-system{background:#76511e}.tag-update{background:#6f2798}.tag-download{background:#245b8f}
.cms-note{padding:10px 12px;margin:0 0 14px;border:1px solid #4a341b;background:#090705;color:#9f8b69;font-size:12px}
@media(max-width:900px){.cms-shell{grid-template-columns:1fr}.cms-side{height:auto;position:relative}.cms-grid{grid-template-columns:1fr}.cms-field.wide{grid-column:auto}}
</style>
</head>
<body>
<div id="adminApp">
<section id="cmsLogin" class="cms-login">
  <h1>F4撿骨182</h1>
  <p>網站內容管理後台</p>
  <input id="loginUser" autocomplete="username" placeholder="帳號">
  <input id="loginPass" type="password" autocomplete="current-password" placeholder="密碼">
  <button id="loginBtn" type="button">登入後台</button>
  <p id="loginMsg"></p>
  <a href="../">← 回官方網站</a>
</section>

<div id="cmsShell" class="cms-shell" hidden>
  <aside class="cms-side">
    <h2>F4撿骨182 CMS</h2>
    <button class="active" data-cms-tab="buttons">網站按鈕設定</button>
    <button data-cms-tab="guides">遊戲介紹內容管理</button>
    <button data-cms-tab="rates">遊戲資訊設定</button>
    <button data-cms-tab="features">遊戲特色管理</button>
    <button data-cms-tab="news">公告管理</button>
    <button data-cms-tab="site">首頁文字與樣式</button>
    <a href="../" target="_blank">開啟前台網站</a>
    <button id="logoutBtn" type="button">登出</button>
  </aside>

  <main class="cms-main">
    <header class="cms-main-head">
      <h1 id="cmsTitle">網站按鈕設定</h1>
      <span id="cmsStatus" class="cms-status">已連接 Firebase</span>
    </header>
    <div class="cms-note">操作方式沿用死亡騎士182。公告新增時日期會自動使用台灣當天日期，不需要手動輸入。</div>
    <div id="cmsMain"></div>
  </main>
</div>
</div>

<script type="module">
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=v=>v?String(v).replaceAll('/','-'):'';
const todayTW=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js');
const {getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');

const app=initializeApp(window.F4_FIREBASE_CONFIG);
const auth=getAuth(app);
const db=getFirestore(app);

let CMS=null, TAB='buttons', GUIDE_ID='server';

function catClass(c){
  if(c==='置頂')return'tag-pinned';
  if(c==='活動')return'tag-activity';
  if(c==='系統')return'tag-system';
  if(c==='更新')return'tag-update';
  if(c==='下載')return'tag-download';
  return'tag-announcement';
}
async function readCol(name){
  const s=await getDocs(collection(db,name));
  return s.docs.map(d=>({__docId:d.id,...d.data()}));
}
async function loadAll(){
  const [buttons,rates,guides,news,support,downloads,features]=await Promise.all([
    readCol('hero_buttons'),readCol('game_rates'),readCol('content_sections'),readCol('announcements'),
    readCol('support_links'),readCol('download_links'),readCol('game_features')
  ]);
  const ss=await getDoc(doc(db,'site_settings','main'));
  const sort=a=>a.sort((x,y)=>(Number(x.sort_order||0)-Number(y.sort_order||0))||String(x.id||'').localeCompare(String(y.id||'')));
  return {
    site:ss.exists()?ss.data():{},
    buttons:sort(buttons),
    rates:sort(rates),
    guides:sort(guides),
    news:news.sort((a,b)=>(+!!b.pinned)-(+!!a.pinned)||String(b.published_on||'').localeCompare(String(a.published_on||''))||Number(b.id||0)-Number(a.id||0)),
    support:sort(support),
    downloads:sort(downloads),
    features:sort(features)
  };
}
async function saveOne(col,x,id){
  const data={...x};delete data.__docId;
  data.updated_at=new Date().toISOString();
  await setDoc(doc(db,col,String(id??x.__docId??x.id)),data,{merge:true});
}
async function saveAllCMS(){
  await Promise.all([
    saveOne('site_settings',CMS.site,'main'),
    ...CMS.buttons.map(x=>saveOne('hero_buttons',x)),
    ...CMS.rates.map(x=>saveOne('game_rates',x)),
    ...CMS.guides.map(x=>saveOne('content_sections',x)),
    ...CMS.news.map(x=>saveOne('announcements',x)),
    ...CMS.support.map(x=>saveOne('support_links',x)),
    ...CMS.downloads.map(x=>saveOne('download_links',x)),
    ...CMS.features.map(x=>saveOne('game_features',x))
  ]);
}

function fld(label,path,value,type='text',wide=false,readonly=false){
  const base=`data-bind="${esc(path)}"`;
  let input;
  if(type==='textarea')input=`<textarea ${base} ${readonly?'readonly':''}>${esc(value)}</textarea>`;
  else if(type==='color')input=`<input ${base} type="color" value="${esc(value||'#ffffff')}" ${readonly?'disabled':''}>`;
  else if(type==='number')input=`<input ${base} data-type="number" type="number" value="${esc(value)}" ${readonly?'readonly':''}>`;
  else if(type==='boolean')input=`<select ${base} data-type="boolean" ${readonly?'disabled':''}><option value="true" ${value?'selected':''}>顯示</option><option value="false" ${!value?'selected':''}>隱藏</option></select>`;
  else input=`<input ${base} type="text" value="${esc(value)}" ${readonly?'readonly':''}>`;
  return `<label class="cms-field ${wide?'wide':''}"><span>${label}</span>${input}</label>`;
}
function setPath(path,val){
  const keys=path.split('.');
  let o=CMS;
  for(let i=0;i<keys.length-1;i++){
    const k=/^\d+$/.test(keys[i])?Number(keys[i]):keys[i];
    o=o[k];
  }
  const last=/^\d+$/.test(keys.at(-1))?Number(keys.at(-1)):keys.at(-1);
  o[last]=val;
}
function syncCMS(){
  $$('[data-bind]').forEach(el=>{
    if(el.disabled||el.readOnly)return;
    let v=el.value;
    if(el.dataset.type==='number')v=Number(v);
    if(el.dataset.type==='boolean')v=v==='true';
    setPath(el.dataset.bind,v);
  });
}
function saveButton(){return '<button class="cms-save" type="button">儲存設定</button>'}
function bindSave(){
  const b=$('.cms-save');
  if(b)b.onclick=async()=>{
    syncCMS();
    const status=$('#cmsStatus');
    status.textContent='儲存中…';
    try{
      await saveAllCMS();
      status.textContent='已儲存，前台重新整理即可看到更新';
    }catch(e){
      console.error(e);
      status.textContent='儲存失敗';
      alert('儲存失敗，請重新登入後再試。');
    }
  };
}

/* 死亡騎士182：網站按鈕設定 = 上方主按鈕 + 客服與支持 + 下載專區，集中在同一頁 */
function renderButtons(){
  const blocks=[['上方主按鈕',CMS.buttons],['下方客服與支持',CMS.support],['下載專區',CMS.downloads]];
  $('#cmsMain').innerHTML=blocks.map(([title,arr])=>`<section class="cms-card"><h2>${title}</h2>${
    arr.map((x,i)=>{
      const prefix=title==='上方主按鈕'?'buttons':title==='下方客服與支持'?'support':'downloads';
      return `<div class="cms-subcard"><div class="cms-grid">
        ${fld('顯示名稱',`${prefix}.${i}.title`,x.title)}
        ${fld('英文副標',`${prefix}.${i}.subtitle`,x.subtitle)}
        ${fld('連結網址',`${prefix}.${i}.url`,x.url,'text',true)}
        ${fld('標題大小',`${prefix}.${i}.title_size`,x.title_size,'number')}
        ${fld('標題顏色',`${prefix}.${i}.title_color`,x.title_color,'color')}
        ${fld('副標大小',`${prefix}.${i}.subtitle_size`,x.subtitle_size,'number')}
        ${fld('副標顏色',`${prefix}.${i}.subtitle_color`,x.subtitle_color,'color')}
        ${fld('顯示狀態',`${prefix}.${i}.visible`,x.visible,'boolean')}
      </div></div>`;
    }).join('')
  }</section>`).join('')+saveButton();
  bindSave();
}
function renderSite(){
  const s=CMS.site;
  $('#cmsMain').innerHTML=`<section class="cms-card"><h2>首頁文字與樣式</h2><div class="cms-grid">
    ${fld('網站名稱','site.brand',s.brand)}
    ${fld('首頁主標題','site.hero_title',s.hero_title)}
    ${fld('主標題大小','site.hero_title_size',s.hero_title_size,'number')}
    ${fld('主標題顏色','site.hero_title_color',s.hero_title_color,'color')}
    ${fld('副標題','site.hero_kicker',s.hero_kicker)}
    ${fld('副標題大小','site.hero_kicker_size',s.hero_kicker_size,'number')}
    ${fld('副標題顏色','site.hero_kicker_color',s.hero_kicker_color,'color')}
    ${fld('回憶文案','site.hero_slogan',s.hero_slogan,'textarea',true)}
    ${fld('文案大小','site.hero_slogan_size',s.hero_slogan_size,'number')}
    ${fld('文案顏色','site.hero_slogan_color',s.hero_slogan_color,'color')}
    ${fld('區塊標題大小','site.section_title_size',s.section_title_size,'number')}
    ${fld('區塊標題顏色','site.section_title_color',s.section_title_color,'color')}
    ${fld('頁尾文字','site.footer_text',s.footer_text,'text',true)}
    ${fld('頁尾大小','site.footer_size',s.footer_size,'number')}
    ${fld('頁尾顏色','site.footer_color',s.footer_color,'color')}
  </div></section>${saveButton()}`;
  bindSave();
}
function renderRates(){
  $('#cmsMain').innerHTML=`<section class="cms-card"><h2>遊戲資訊設定</h2>${
    CMS.rates.map((x,i)=>`<div class="cms-subcard"><div class="cms-grid">
      ${fld('名稱',`rates.${i}.label`,x.label)}
      ${fld('倍率',`rates.${i}.value`,x.value,'number')}
      ${fld('名稱大小',`rates.${i}.label_size`,x.label_size,'number')}
      ${fld('名稱顏色',`rates.${i}.label_color`,x.label_color,'color')}
      ${fld('數字大小',`rates.${i}.value_size`,x.value_size,'number')}
      ${fld('數字顏色',`rates.${i}.value_color`,x.value_color,'color')}
    </div></div>`).join('')
  }</section>${saveButton()}`;
  bindSave();
}
function renderGuides(){
  const idx=Math.max(0,CMS.guides.findIndex(g=>g.id===GUIDE_ID));
  const g=CMS.guides[idx];
  if(!g){$('#cmsMain').innerHTML='<section class="cms-card">目前沒有遊戲介紹資料</section>';return}
  $('#cmsMain').innerHTML=`<section class="cms-card"><h2>遊戲介紹內容管理</h2>
    <div class="cms-tabs">${CMS.guides.map(x=>`<button type="button" data-guide-tab="${esc(x.id)}" class="${x.id===g.id?'active':''}">${esc(x.title)}</button>`).join('')}</div>
    <div class="cms-grid">
      ${fld('分類標題',`guides.${idx}.title`,g.title)}
      ${fld('首頁摘要',`guides.${idx}.summary`,g.summary)}
      ${fld('完整內容',`guides.${idx}.body`,g.body,'textarea',true)}
      ${fld('圖片網址',`guides.${idx}.image_url`,g.image_url,'text',true)}
      ${fld('標題大小',`guides.${idx}.title_size`,g.title_size,'number')}
      ${fld('標題顏色',`guides.${idx}.title_color`,g.title_color,'color')}
      ${fld('摘要大小',`guides.${idx}.summary_size`,g.summary_size,'number')}
      ${fld('摘要顏色',`guides.${idx}.summary_color`,g.summary_color,'color')}
      ${fld('內文大小',`guides.${idx}.body_size`,g.body_size,'number')}
      ${fld('內文顏色',`guides.${idx}.body_color`,g.body_color,'color')}
      ${fld('顯示狀態',`guides.${idx}.visible`,g.visible,'boolean')}
    </div>
  </section>${saveButton()}`;
  $$('[data-guide-tab]').forEach(b=>b.onclick=()=>{syncCMS();GUIDE_ID=b.dataset.guideTab;renderGuides()});
  bindSave();
}
function renderFeatures(){
  $('#cmsMain').innerHTML=`<section class="cms-card"><h2>遊戲特色</h2>${
    CMS.features.map((x,i)=>`<div class="cms-subcard"><div class="cms-grid">
      ${fld('標題',`features.${i}.title`,x.title)}
      ${fld('副標',`features.${i}.subtitle`,x.subtitle)}
      ${fld('圖片網址',`features.${i}.image_url`,x.image_url,'text',true)}
      ${fld('標題大小',`features.${i}.title_size`,x.title_size,'number')}
      ${fld('標題顏色',`features.${i}.title_color`,x.title_color,'color')}
      ${fld('副標大小',`features.${i}.subtitle_size`,x.subtitle_size,'number')}
      ${fld('副標顏色',`features.${i}.subtitle_color`,x.subtitle_color,'color')}
      ${fld('顯示狀態',`features.${i}.visible`,x.visible,'boolean')}
    </div></div>`).join('')
  }</section>${saveButton()}`;
  bindSave();
}
function renderNewsAdmin(){
  $('#cmsMain').innerHTML=`<section class="cms-card">
    <div class="cms-card-head"><h2>公告管理</h2><button id="addNews" type="button">＋ 新增公告</button></div>
    ${CMS.news.map((n,i)=>`<details class="cms-ann">
      <summary><span class="tag ${catClass(n.category)}">${esc(n.category)}</span> ${esc(n.title)} <small>${fmtDate(n.published_on)}</small></summary>
      <div class="cms-grid">
        ${fld('分類',`news.${i}.category`,n.category)}
        ${fld('發布日期',`news.${i}.published_on`,n.published_on,'text',false,true)}
        ${fld('標題',`news.${i}.title`,n.title,'text',true)}
        ${fld('首頁摘要',`news.${i}.summary`,n.summary,'textarea',true)}
        ${fld('完整內容',`news.${i}.body`,n.body,'textarea',true)}
        ${fld('圖片網址',`news.${i}.image_url`,n.image_url,'text',true)}
        ${fld('標題大小',`news.${i}.title_size`,n.title_size,'number')}
        ${fld('標題顏色',`news.${i}.title_color`,n.title_color,'color')}
        ${fld('摘要大小',`news.${i}.summary_size`,n.summary_size,'number')}
        ${fld('摘要顏色',`news.${i}.summary_color`,n.summary_color,'color')}
        ${fld('內文大小',`news.${i}.body_size`,n.body_size,'number')}
        ${fld('內文顏色',`news.${i}.body_color`,n.body_color,'color')}
        ${fld('置頂',`news.${i}.pinned`,n.pinned,'boolean')}
        ${fld('發布/隱藏',`news.${i}.visible`,n.visible,'boolean')}
      </div>
      <button class="cms-delete" type="button" data-delete-news="${n.id}">刪除此公告</button>
    </details>`).join('')}
  </section>${saveButton()}`;

  $('#addNews').onclick=()=>{
    syncCMS();
    CMS.news.unshift({
      id:Date.now(),
      category:'公告',
      title:'新公告',
      summary:'',
      body:'',
      image_url:'',
      published_on:todayTW(),
      pinned:false,
      visible:true,
      title_size:22,title_color:'#e7bd66',
      summary_size:14,summary_color:'#a8926a',
      body_size:16,body_color:'#ddc89e'
    });
    renderNewsAdmin();
  };
  $$('[data-delete-news]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此公告？'))return;
    syncCMS();
    const n=CMS.news.find(n=>String(n.id)===b.dataset.deleteNews);
    if(n?.__docId||n?.id) await deleteDoc(doc(db,'announcements',String(n.__docId??n.id)));
    CMS.news=CMS.news.filter(n=>String(n.id)!==b.dataset.deleteNews);
    renderNewsAdmin();
  });
  bindSave();
}
function renderTab(){
  const title={buttons:'網站按鈕設定',guides:'遊戲介紹內容管理',rates:'遊戲資訊設定',site:'首頁文字樣式',features:'遊戲特色管理',news:'公告管理'}[TAB];
  $('#cmsTitle').textContent=title;
  $$('[data-cms-tab]').forEach(b=>b.classList.toggle('active',b.dataset.cmsTab===TAB));
  if(TAB==='buttons')renderButtons();
  if(TAB==='guides')renderGuides();
  if(TAB==='rates')renderRates();
  if(TAB==='site')renderSite();
  if(TAB==='features')renderFeatures();
  if(TAB==='news')renderNewsAdmin();
}
async function enterCMS(){
  CMS=await loadAll();
  $('#cmsLogin').hidden=true;
  $('#cmsShell').hidden=false;
  $$('[data-cms-tab]').forEach(b=>b.onclick=()=>{syncCMS();TAB=b.dataset.cmsTab;renderTab()});
  renderTab();
}
$('#loginBtn').onclick=async()=>{
  const u=$('#loginUser').value.trim();
  const p=$('#loginPass').value;
  $('#loginMsg').textContent='驗證中…';
  try{
    await signInWithEmailAndPassword(auth,u,p);
    $('#loginMsg').textContent='';
  }catch(e){
    console.error(e);
    $('#loginMsg').textContent='帳號或密碼錯誤';
  }
};
$('#logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
  if(user){
    try{await enterCMS()}catch(e){console.error(e);$('#loginMsg').textContent='資料讀取失敗'}
  }else{
    $('#cmsLogin').hidden=false;
    $('#cmsShell').hidden=true;
  }
});
</script>
</body>
</html>
