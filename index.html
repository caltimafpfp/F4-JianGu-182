<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4撿骨182｜天堂1.82純手動經典服</title>
<style>
*{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}
body{margin:0;background:#000;color:#ddcaa2;font-family:"Microsoft JhengHei",serif}
a{color:inherit;text-decoration:none}button{font:inherit}.page{max-width:1920px;margin:auto;background:#020201;min-height:100vh}
.hero{position:relative;aspect-ratio:1672/432;border-bottom:1px solid #6e4b20;overflow:hidden;background:#080604}
.hero>img{width:100%;height:100%;object-fit:contain}.hot{position:absolute;z-index:2}
.nav1{left:32.4%;top:0;width:7%;height:16%}.nav2{left:39.3%;top:0;width:8.2%;height:16%}.nav3{left:47.8%;top:0;width:8.3%;height:16%}
.nav4{left:56.7%;top:0;width:8.5%;height:16%}.nav5{left:66.1%;top:0;width:8.5%;height:16%}.nav6{left:75.1%;top:0;width:9.2%;height:16%}
.bd{left:18.3%;top:75%;width:12%;height:19%}.bl{left:30.6%;top:75%;width:12.7%;height:19%}.bs{left:43.5%;top:75%;width:11.7%;height:19%}
.main{padding:0 32px 16px;background:#030302}.top{display:grid;grid-template-columns:25% 34% 21% 1fr;gap:8px;min-height:320px}
.bot{display:grid;grid-template-columns:31% 31% 1fr;gap:8px;margin-top:8px;min-height:260px}.panel{border:1px solid #5f411d;background:#070604}
.ph{height:46px;display:grid;place-items:center;border-bottom:1px solid #4a3319;color:#dbad55;font-size:20px;font-weight:700}
.news{padding:8px 14px}.nr{height:31px;display:grid;grid-template-columns:44px 1fr 82px 10px;gap:7px;align-items:center;border-bottom:1px solid #2b2419;font-size:12px;cursor:pointer}
.tag{padding:3px;color:#fff;text-align:center;font-size:10px;background:#b54838}.event{background:#4d7d25}.system{background:#744494}.update{background:#2d668d}.download{background:#ad6c22}
.nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nd{font-size:10px;color:#8b7c65;text-align:right}.gw{padding:8px 10px}.gb{position:relative}.gb>img{width:100%;display:block}
.gh{position:absolute;border:0;background:transparent;cursor:pointer}.rates{padding:10px 14px}.rate{height:36px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;border-bottom:1px solid #2d2519}
.rv{color:#edc157;font-size:18px;font-weight:700}.tail{overflow:hidden}.tail img{width:100%;height:100%;object-fit:cover;filter:brightness(.72)}
.sg,.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px}.si,.di{border:1px solid #49341b;background:#0b0805;min-height:94px;padding:13px;display:flex;align-items:center;gap:10px}
.ico{width:50px;height:50px;object-fit:contain;flex:none}.si strong,.di strong{display:block;color:#dfb25a;font-size:17px}.si small{color:#8a775a;font-size:10px}.di small{display:none}.di{display:block}
.dt{display:grid;grid-template-columns:54px 1fr;align-items:center}.db{display:block;margin-top:10px;height:38px;border:1px solid #8b5e25;background:#3b260d;text-align:center;color:#f3c66f;font-size:17px;font-weight:700;line-height:36px}
.fg{padding:10px}.fg img{width:100%;display:block}.detail{margin-top:18px;border:1px solid #6a4a22;background:#07080d;padding:22px}.detail[hidden]{display:none}.dh{position:relative;padding-right:105px}
.dh h2{margin:0;color:#efbd58;font-size:27px}.dh p{color:#c6b48e}.back{position:absolute;right:0;top:0;width:82px;height:78px;border:1px solid #765329;background:#090b10;color:#e4b95f;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;border:1px solid #4a3825;background:#100d0a;padding:10px;text-align:left;color:#d9c7a0;cursor:pointer}
.card.on{border-color:#d39a35}.thumb{width:86px;height:66px;object-fit:cover;border:1px solid #5b411f}.card small{display:block;margin-top:5px;color:#9b8a6c}
.body{white-space:pre-wrap;line-height:1.9;border:1px solid #49351f;background:#100d0a;padding:18px;min-height:120px}.imgs img{display:block;max-width:100%;max-height:700px;margin:14px auto;border:1px solid #57401f}
.footer{height:78px;border-top:1px solid #463219;background:#040302;display:grid;place-items:center;color:#88765a;text-align:center}.footer b{color:#d7aa52;font-size:22px}
.notice{display:none;margin:10px 0;padding:10px;border:1px solid #8a682b;background:#191207;color:#f3cb78;text-align:center;font-size:13px}
@media(max-width:1100px){.top{grid-template-columns:1fr 1.3fr .9fr}.tail{display:none}.bot{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.main{padding:0 10px 16px}}
@media(max-width:700px){.top,.bot,.cards{grid-template-columns:1fr}}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="page">
<section class="hero" id="home">
  <img src="https://cdn-editing-temp.picsart.com/editing-temp/d300ed62-ae1b-4117-a319-b46f45cff906.png" alt="F4撿骨182">
  <a class="hot nav1" href="#home"></a><a class="hot nav2" href="#guide"></a><a class="hot nav3" href="#info"></a>
  <a class="hot nav4" href="#news"></a><a class="hot nav5" href="#support"></a><a class="hot nav6" href="#dl"></a>
  <a id="heroDownload" class="hot bd" href="#dl"></a><a id="heroLine" class="hot bl" href="#support"></a><a id="heroDonate" class="hot bs" href="#support"></a>
</section>
<main class="main">
<div id="statusNotice" class="notice"></div>
<div class="top">
  <section class="panel" id="news"><div class="ph">最新公告</div><div class="news" id="nl"></div></section>
  <section class="panel" id="guide"><div class="ph">遊戲介紹</div><div class="gw"><div class="gb" id="gg"></div></div></section>
  <section class="panel" id="info"><div class="ph">遊戲資訊</div><div class="rates" id="rates"></div></section>
  <aside class="tail"><img src="https://cdn-editing-temp.picsart.com/editing-temp/80d7d6b7-9230-42a4-9c39-0ee8c815276c.png" alt=""></aside>
</div>
<div class="bot">
  <section class="panel" id="support"><div class="ph">客服與支持</div><div class="sg" id="sg"></div></section>
  <section class="panel" id="dl"><div class="ph">下載專區</div><div class="dg" id="dg"></div></section>
  <section class="panel"><div class="ph">遊戲特色</div><div class="fg"><img src="https://cdn-editing-temp.picsart.com/editing-temp/7c54f6db-b873-42db-872d-4092270448d6.png" alt="遊戲特色"></div></section>
</div>
<section class="detail" id="detail" hidden><div id="dbody"></div></section>
</main>
<footer class="footer"><div><b id="footBrand">F4撿骨182</b><br><span id="footText">天堂1.82純手動經典服</span></div></footer>
</div>

<script type="module">
const ORDER=['server','feature','weapon','armor','doll','map','item'];
let D={};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const px=(v,d)=>Math.min(Math.max(+v||d,9),72);
const co=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
const configured=()=>window.F4_FIREBASE_CONFIG && !String(window.F4_FIREBASE_CONFIG.apiKey||'').includes('PASTE_');

async function readFirebase(){
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
  const {getFirestore,collection,getDocs,doc,getDoc}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');
  const app=initializeApp(window.F4_FIREBASE_CONFIG);
  const db=getFirestore(app);
  async function col(name){
    const s=await getDocs(collection(db,name));
    return s.docs.map(d=>({__docId:d.id,id:d.id,...d.data()}));
  }
  const [news,guides,entries,rates,support,downloads,hero]=await Promise.all([
    col('announcements'),col('content_sections'),col('guide_entries'),col('game_rates'),
    col('support_links'),col('download_links'),col('hero_buttons')
  ]);
  const ss=await getDoc(doc(db,'site_settings','main'));
  return {news,guides,entries,rates,support,downloads,hero,settings:ss.exists()?ss.data():{}};
}

function sortData(){
  D.news=(D.news||[]).filter(x=>x.visible!==false).sort((a,b)=>(+!!b.pinned)-(+!!a.pinned)||String(b.published_on||'').localeCompare(String(a.published_on||''))||Number(b.id||0)-Number(a.id||0));
  for(const k of ['guides','entries','rates','support','downloads','hero']){
    D[k]=(D[k]||[]).filter(x=>x.visible!==false).sort((a,b)=>(Number(a.sort_order||0)-Number(b.sort_order||0))||String(a.id).localeCompare(String(b.id)));
  }
}

function cls(c){return c==='活動'?'event':c==='系統'?'system':c==='更新'?'update':c==='下載'?'download':''}
function cname(c){return['公告','活動','系統','更新','下載'].includes(c)?c:'公告'}
function openP(h,back='#guide'){dbody.innerHTML=h;detail.hidden=false;detail.dataset.back=back;detail.scrollIntoView({behavior:'smooth'})}
window.closeP=function(){detail.hidden=true;document.querySelector(detail.dataset.back||'#guide')?.scrollIntoView({behavior:'smooth'})}

function openN(id){
  const n=D.news.find(x=>String(x.id)===String(id)); if(!n)return;
  const im=Array.isArray(n.images)?n.images:[];
  openP(`<div class="dh"><h2>最新公告</h2><p>公告完整內容</p><button class="back" onclick="closeP()">返回公告</button></div>
  <h2 style="font-size:${px(n.title_size,22)}px;color:${co(n.title_color,'#e7bd66')}">${esc(n.title)}</h2>
  <p style="font-size:${px(n.summary_size,14)}px;color:${co(n.summary_color,'#a8926a')}">${esc(n.summary)}</p>
  <div class="body" style="font-size:${px(n.body_size,16)}px;color:${co(n.body_color,'#ddc89e')}">${esc(n.body)}</div>
  <div class="imgs">${im.map(u=>`<img src="${esc(u)}">`).join('')}</div>`,'#news');
}
function card(x,on){
  const im=Array.isArray(x.images)?x.images:[];
  const th=im[0]?`<img class="thumb" src="${esc(im[0])}">`:`<span class="thumb"></span>`;
  return `<button class="card ${on?'on':''}" data-e="${esc(x.id)}">${th}<span><b style="color:${co(x.title_color,'#ffd987')}">${esc(x.title)}</b><small>${esc(x.intro)}</small></span></button>`
}
function openG(id){
  const c=D.guides.find(x=>String(x.id)===String(id));
  const a=D.entries.filter(x=>String(x.category_id)===String(id));
  openP(`<div class="dh"><h2>${esc(c?.title||'遊戲介紹')}</h2><p>共 ${a.length} 篇內容，請選擇下方項目查看完整介紹。</p><button class="back" onclick="closeP()">返回分類</button></div>
  ${a.length?`<div class="cards">${a.map((x,i)=>card(x,!i)).join('')}</div><div id="entry"></div>`:'目前沒有已發布文章。'}`);
  if(a.length){showE(a[0].id);document.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>showE(x.dataset.e))}
}
function showE(id){
  const x=D.entries.find(y=>String(y.id)===String(id)); if(!x)return;
  const im=Array.isArray(x.images)?x.images:[];
  document.querySelectorAll('[data-e]').forEach(y=>y.classList.toggle('on',String(y.dataset.e)===String(id)));
  entry.innerHTML=`<h2 style="font-size:${px(x.title_size,22)}px;color:${co(x.title_color,'#ffd987')}">${esc(x.title)}</h2>
  <p style="font-size:${px(x.intro_size,14)}px;color:${co(x.intro_color,'#b8ad9e')}">${esc(x.intro)}</p>
  <div class="body" style="font-size:${px(x.content_size,16)}px;color:${co(x.content_color,'#e8dcc9')}">${esc(x.content)}</div>
  <div class="imgs">${im.map(u=>`<img src="${esc(u)}">`).join('')}</div>`;
}
function sicon(x){
  const t=(String(x.title||'')+' '+String(x.subtitle||'')).toLowerCase();
  if(t.includes('line'))return'https://cdn.simpleicons.org/line/00C300';
  if(t.includes('fb')||t.includes('facebook')||t.includes('粉絲'))return'https://api.iconify.design/logos:facebook.svg';
  if(t.includes('贊助'))return'https://api.iconify.design/material-symbols:favorite-rounded.svg?color=%23E3A23A';
  return'https://api.iconify.design/material-symbols:report-rounded.svg?color=%23D95849'
}
function dicon(x){
  const t=(String(x.title||'')+' '+String(x.subtitle||'')).toLowerCase();
  return t.includes('google')||t.includes('drive')?'https://api.iconify.design/logos:google-drive.svg':'https://api.iconify.design/material-symbols:download-rounded.svg?color=%23D9A03A'
}
function bindHero(){
  const a=(D.hero||[]).slice();
  const els=[heroDownload,heroLine,heroDonate];
  els.forEach((el,i)=>{
    const x=a[i]; if(!el||!x)return;
    const u=String(x.url||'').trim();
    if(u&&u!=='#'){el.href=u;el.target='_blank';el.rel='noopener'}
  });
}
function render(){
  sortData(); bindHero();
  nl.innerHTML=D.news.slice(0,6).map(n=>`<div class="nr" data-n="${esc(n.id)}"><span class="tag ${cls(cname(n.category))}">${cname(n.category)}</span><span class="nt">${esc(n.title)}</span><span class="nd">${esc(n.published_on||'')}</span><span>›</span></div>`).join('')||'目前沒有公告';
  document.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{
    const n=D.news.find(y=>String(y.id)===String(x.dataset.n));
    const key=n?.__docId??n?.id??x.dataset.n;
    location.href=`news.html?id=${encodeURIComponent(key)}`;
  });

  const g=ORDER.map(i=>D.guides.find(x=>String(x.id)===i)).filter(Boolean);
  gg.innerHTML=`<img src="https://cdn-editing-temp.picsart.com/editing-temp/4e1103f2-4580-4263-95f5-e78fe3e71fc4.png">
  <button class="gh" data-g="0" style="left:1.5%;top:2%;width:23%;height:46%"></button><button class="gh" data-g="1" style="left:26.5%;top:2%;width:23%;height:46%"></button>
  <button class="gh" data-g="2" style="left:51.4%;top:2%;width:23%;height:46%"></button><button class="gh" data-g="3" style="left:76.2%;top:2%;width:22.5%;height:46%"></button>
  <button class="gh" data-g="4" style="left:1.5%;top:51%;width:29%;height:47%"></button><button class="gh" data-g="5" style="left:32.5%;top:51%;width:30.5%;height:47%"></button>
  <button class="gh" data-g="6" style="left:65%;top:51%;width:33.5%;height:47%"></button>`;
  document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>g[x.dataset.g]&&openG(g[x.dataset.g].id));

  rates.innerHTML=D.rates.slice(0,6).map(r=>`<div class="rate"><span>✧</span><span>${esc(r.label)}</span><span class="rv">${esc(r.value)}倍</span></div>`).join('');
  sg.innerHTML=D.support.slice(0,4).map(x=>`<a class="si" href="${esc(x.url||'#')}" target="_blank" rel="noopener"><img class="ico" src="${sicon(x)}"><span><strong>${esc(x.title)}</strong><small>${esc(x.subtitle||'')}</small></span></a>`).join('');
  dg.innerHTML=D.downloads.slice(0,4).map(x=>{const u=String(x.url||'#').trim()||'#';return`<a class="di" href="${esc(u)}" ${u!=='#'?'target="_blank" rel="noopener"':''}><div class="dt"><img class="ico" src="${dicon(x)}"><span><strong>${esc(x.title)}</strong></span></div><span class="db">點我下載</span></a>`}).join('');
  const s=D.settings||{};
  if(s.brand)footBrand.textContent=s.brand;
  if(s.footer_text)footText.textContent=s.footer_text;
}
async function run(){
  const note=statusNotice;
  try{
    if(!configured()) throw new Error('Firebase 尚未設定');
    D=await readFirebase();
  }catch(err){
    console.error(err);
    note.style.display='block';
    note.textContent='Firebase 資料讀取失敗，請稍後再試。';
    D={news:[],guides:[],entries:[],rates:[],support:[],downloads:[],hero:[],settings:{}};
  }
  render();
}
run();
</script>
</body>
</html>
