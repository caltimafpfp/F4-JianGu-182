<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新公告｜F4撿骨182</title>
<script src="firebase-config.js"></script>
<style>
*{box-sizing:border-box}
html{background:#050207}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -20%,#18091c 0,#0a050e 42%,#050207 78%),
    #050207;
  color:#e8dcc9;
  font-family:"Microsoft JhengHei",serif;
}
a{color:inherit;text-decoration:none}
.page{width:min(900px,calc(100% - 30px));margin:0 auto;padding:10px 0 70px}
.article{
  position:relative;
  min-height:88vh;
  padding:52px 54px 64px;
  background:#0a0d14;
  border-left:1px solid #9a6624;
  border-right:1px solid #9a6624;
  box-shadow:0 0 70px rgba(0,0,0,.45);
}
.article:before,.article:after{
  content:"";
  position:absolute;
  top:0;
  width:12px;height:12px;
  background:#efb84c;
  transform:rotate(45deg);
}
.article:before{left:-6px}
.article:after{right:-6px}
.topline{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:28px;
  color:#c7ab78;
  font-size:13px;
}
.tag{
  display:inline-block;
  min-width:42px;
  padding:4px 9px;
  text-align:center;
  border:1px solid #a86e25;
  color:#efc067;
  background:#101114;
}
.title{
  margin:0 0 26px;
  font-family:Georgia,"Microsoft JhengHei",serif;
  font-size:42px;
  line-height:1.3;
  color:#f1c76e;
  font-weight:700;
}
.summary{
  margin:0 0 34px;
  font-size:16px;
  line-height:1.85;
  color:#e9dfce;
}
.body{
  white-space:pre-wrap;
  font-size:16px;
  line-height:1.9;
  color:#f0e6d4;
}
.images img{
  display:block;
  max-width:100%;
  height:auto;
  margin:24px auto 0;
  border:1px solid #60451f;
}
.back{
  position:fixed;
  right:28px;
  bottom:28px;
  padding:10px 16px;
  border:1px solid #936329;
  background:#121217;
  color:#e7bb61;
  cursor:pointer;
  z-index:5;
}
.loading{
  min-height:70vh;
  display:grid;
  place-items:center;
  color:#c8a96d;
}
.error{
  padding:60px 20px;
  text-align:center;
  color:#e6c27b;
}
@media(max-width:700px){
  .page{width:100%;padding:0}
  .article{padding:34px 22px 60px;border-left:0;border-right:0}
  .article:before,.article:after{display:none}
  .title{font-size:30px}
  .summary,.body{font-size:15px}
  .back{right:16px;bottom:16px}
}
</style>
</head>
<body>
<div class="page">
  <main id="app" class="loading">公告讀取中…</main>
</div>
<button class="back" onclick="location.href='index.html#news'">返回公告</button>

<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const px=(v,d)=>Math.min(Math.max(+v||d,9),72);
const co=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
const params=new URLSearchParams(location.search);
const key=params.get('id');

async function loadNews(){
  if(!key) throw new Error('缺少公告 ID');

  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
  const {getFirestore,doc,getDoc,collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');

  const fb=initializeApp(window.F4_FIREBASE_CONFIG);
  const db=getFirestore(fb);

  // 先用 Firestore document id 直接讀取
  const direct=await getDoc(doc(db,'announcements',key));
  if(direct.exists()) return {__docId:direct.id,...direct.data()};

  // 相容舊資料：若網址帶的是資料內 id，再掃一次找到對應公告
  const snap=await getDocs(collection(db,'announcements'));
  for(const d of snap.docs){
    const row=d.data();
    if(String(row.id??'')===String(key)) return {__docId:d.id,...row};
  }
  throw new Error('找不到這篇公告');
}

function imagesOf(n){
  if(Array.isArray(n.images)) return n.images.filter(Boolean);
  if(Array.isArray(n.image_urls)) return n.image_urls.filter(Boolean);
  const arr=[];
  if(n.image_url) arr.push(n.image_url);
  return arr;
}

try{
  const n=await loadNews();
  if(n.visible===false) throw new Error('此公告目前未發布');

  document.title=`${n.title||'最新公告'}｜F4撿骨182`;
  const imgs=imagesOf(n);

  app.className='article';
  app.innerHTML=`
    <div class="topline">
      <span class="tag">${esc(n.category||'公告')}</span>
      <span>${esc((n.published_on||'').replaceAll('-','/'))}</span>
    </div>
    <h1 class="title" style="font-size:${px(n.title_size,42)}px;color:${co(n.title_color,'#f1c76e')}">${esc(n.title||'未命名公告')}</h1>
    ${n.summary?`<p class="summary" style="font-size:${px(n.summary_size,16)}px;color:${co(n.summary_color,'#e9dfce')}">${esc(n.summary)}</p>`:''}
    <div class="body" style="font-size:${px(n.body_size,16)}px;color:${co(n.body_color,'#f0e6d4')}">${esc(n.body||'')}</div>
    <div class="images">${imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>
  `;
}catch(err){
  console.error(err);
  app.className='error';
  app.innerHTML=`<h2>公告讀取失敗</h2><p>${esc(err?.message||'請稍後再試')}</p>`;
}
</script>
</body>
</html>
