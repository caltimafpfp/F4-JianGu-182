<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新公告｜F4撿骨182</title>
<script src="firebase-config.js"></script>
<style>

*{box-sizing:border-box}
html{background:#050207}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(67,18,70,.22),transparent 42%),
    linear-gradient(180deg,#070208 0%,#030104 100%);
  color:#f1e6d4;
  font-family:"Microsoft JhengHei","Noto Serif TC",serif;
}
a{color:inherit;text-decoration:none}
.page{
  width:min(1040px,calc(100% - 36px));
  margin:0 auto;
  padding:10px 0 72px;
}
.article{
  position:relative;
  min-height:calc(100vh - 20px);
  padding:54px 58px 72px;
  background:
    linear-gradient(180deg,rgba(15,18,27,.98),rgba(9,11,18,.99));
  border-left:1px solid #9f6c28;
  border-right:1px solid #9f6c28;
  border-top:1px solid #9f6c28;
  box-shadow:
    0 0 0 1px rgba(255,190,79,.03) inset,
    0 30px 90px rgba(0,0,0,.45);
}
.article:before,.article:after{
  content:"";
  position:absolute;
  top:-7px;
  width:13px;height:13px;
  background:#efb84c;
  transform:rotate(45deg);
  box-shadow:0 0 12px rgba(239,184,76,.18);
}
.article:before{left:-7px}
.article:after{right:-7px}

.topline{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:24px;
  color:#d3b681;
  font-size:14px;
}
.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:46px;
  height:28px;
  padding:0 10px;
  border:1px solid #a66f27;
  color:#f2c369;
  background:#0e0d0b;
  box-shadow:0 0 0 1px rgba(255,190,79,.05) inset;
}
.date{letter-spacing:.02em}

.title{
  margin:0 0 24px;
  font-family:Georgia,"Microsoft JhengHei","Noto Serif TC",serif;
  font-size:48px !important;
  line-height:1.28;
  letter-spacing:.02em;
  color:#f0c36b !important;
  font-weight:700;
  text-shadow:0 2px 18px rgba(235,174,72,.08);
}
.summary{
  margin:0 0 34px;
  padding-bottom:24px;
  border-bottom:1px solid rgba(166,111,39,.25);
  font-size:18px !important;
  line-height:1.95;
  color:#efe4d0 !important;
}
.body{
  white-space:pre-wrap;
  font-size:18px !important;
  line-height:2;
  color:#f3e8d5 !important;
  letter-spacing:.01em;
}
.body:empty{display:none}

.images{
  margin-top:26px;
}
.images img{
  display:block;
  max-width:100%;
  height:auto;
  margin:26px auto 0;
  border:1px solid #6b4a20;
  box-shadow:0 16px 40px rgba(0,0,0,.28);
}

.back{
  position:fixed;
  right:28px;
  bottom:28px;
  min-width:112px;
  height:42px;
  padding:0 18px;
  border:1px solid #9a6827;
  background:linear-gradient(180deg,#19140d,#100d0a);
  color:#eec16b;
  cursor:pointer;
  z-index:5;
  box-shadow:0 10px 28px rgba(0,0,0,.3);
}
.back:hover{
  border-color:#d49735;
  color:#ffd783;
}

.loading{
  min-height:70vh;
  display:grid;
  place-items:center;
  color:#d4b16c;
  font-size:18px;
}
.error{
  min-height:55vh;
  display:grid;
  place-items:center;
  text-align:center;
  color:#e6c27b;
}

@media(max-width:760px){
  .page{width:100%;padding:0}
  .article{
    min-height:100vh;
    padding:34px 22px 70px;
    border-left:0;
    border-right:0;
  }
  .article:before,.article:after{display:none}
  .title{font-size:34px !important}
  .summary{font-size:16px !important}
  .body{font-size:16px !important}
  .back{right:14px;bottom:14px;min-width:96px}
}

</style>
</head>
<body>
<div class="page">
  <main id="app" class="loading">公告讀取中…</main>
</div>
<button class="back" onclick="location.href='index.html#news'">返回公告</button>

<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const px=(v,d)=>Math.min(Math.max(+v||d,9),72);
const co=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
const params=new URLSearchParams(location.search);
const key=params.get('id');

async function loadNews(){
  if(!key) throw new Error('缺少公告 ID');

  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
  const {getFirestore,doc,getDoc,collection,getDocs}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');

  const fb=initializeApp(window.F4_FIREBASE_CONFIG);
  const db=getFirestore(fb);

  // 先用 Firestore document id 直接讀取
  const direct=await getDoc(doc(db,'announcements',key));
  if(direct.exists()) return {__docId:direct.id,...direct.data()};

  // 相容舊資料：若網址帶的是資料內 id，再掃一次找到對應公告
  const snap=await getDocs(collection(db,'announcements'));
  for(const d of snap.docs){
    const row=d.data();
    if(String(row.id??'')===String(key)) return {__docId:d.id,...row};
  }
  throw new Error('找不到這篇公告');
}

function imagesOf(n){
  if(Array.isArray(n.images)) return n.images.filter(Boolean);
  if(Array.isArray(n.image_urls)) return n.image_urls.filter(Boolean);
  const arr=[];
  if(n.image_url) arr.push(n.image_url);
  return arr;
}

try{
  const n=await loadNews();
  if(n.visible===false) throw new Error('此公告目前未發布');

  document.title=`${n.title||'最新公告'}｜F4撿骨182`;
  const imgs=imagesOf(n);

  app.className='article';
  app.innerHTML=`
    <div class="topline">
      <span class="tag">${esc(n.category||'公告')}</span>
      <span class="date">${esc((n.published_on||'').replaceAll('-','/'))}</span>
    </div>
    <h1 class="title">${esc(n.title||'未命名公告')}</h1>
    ${n.summary?`<p class="summary">${esc(n.summary)}</p>`:''}
    <div class="body">${esc(n.body||'')}</div>
    <div class="images">${imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>
  `;
}catch(err){
  console.error(err);
  app.className='error';
  app.innerHTML=`<h2>公告讀取失敗</h2><p>${esc(err?.message||'請稍後再試')}</p>`;
}
</script>
</body>
</html>
